services:
  db:
    image: pgvector/pgvector:pg16
    environment:
      POSTGRES_USER: hr
      POSTGRES_PASSWORD: hr
      POSTGRES_DB: hr_agent
    ports:
      - "5434:5432"
    volumes:
      - hr_agent_pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U hr -d hr_agent"]
      interval: 5s
      timeout: 5s
      retries: 10

  api:
    build: .
    env_file: .env
    environment:
      DATABASE_URL: postgres://hr:hr@db:5432/hr_agent
    ports:
      - "3004:3004"
    volumes:
      - hr_agent_uploads:/app/uploads
    depends_on:
      db:
        condition: service_healthy

volumes:
  hr_agent_pgdata:
  hr_agent_uploads:
